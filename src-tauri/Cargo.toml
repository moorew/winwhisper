[package]
name = "winwhisper"
version = "0.5.1"
description = "WinWhisper — Premium Windows Transcription App"
authors = []
edition = "2021"

[lib]
name = "winwhisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` backs convertFileSrc(), which the transcript editor uses to
# load audio into the waveform player. It must match assetProtocol.enable in
# tauri.conf.json — the CLI silently injects it during `tauri build`, so without
# it declared here a plain `cargo build`/`clippy` fails and the committed
# manifest disagrees with the shipped binary.
tauri        = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["net", "time", "rt", "process", "io-util"] }
zip          = { version = "2", default-features = false, features = ["deflate"] }

# Start with Windows so a machine sharing its GPU is available without someone
# having to open the app on it first. Wrapped in our own commands rather than
# exposed directly — plugin commands are subject to the capability ACL, ours
# are not, which is the same reason the window controls are wrapped.
tauri-plugin-autostart = "2"

# Mica behind the custom titlebar and rail on Windows 11. The chrome gradient
# in globals.css is the fallback wherever it cannot be applied.
[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"

[profile.dev]
incremental = true

[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
