[package]
name = "winwhisper"
version = "0.1.6"
description = "WinWhisper — Premium Windows Transcription App"
authors = []
edition = "2021"

[lib]
name = "winwhisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = ["tray-icon", "image-png"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tokio        = { version = "1", features = ["net", "time", "rt", "process", "io-util"] }

[profile.dev]
incremental = true

[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
