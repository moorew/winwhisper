name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python sidecar ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('engine/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        shell: pwsh
        run: |
          cd engine
          pip install --upgrade pip
          # Install torch with CUDA 12.1 for GPU support; falls back to CPU at runtime
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu121
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python sidecar (single-file EXE)
        shell: pwsh
        run: |
          cd engine
          pyinstaller winwhisper_engine.spec

      - name: Stage sidecar for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\binaries" | Out-Null
          $src = "engine\dist\winwhisper_engine.exe"
          $dst = "src-tauri\binaries\winwhisper_engine-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $src)) { throw "PyInstaller output not found: $src" }
          Copy-Item $src $dst
          if (-not (Test-Path $dst)) { throw "Copy failed — sidecar not at: $dst" }
          $mb = [math]::Round((Get-Item $dst).Length / 1MB, 1)
          Write-Host "Staged sidecar: $dst ($mb MB)"

      # ── Node / Frontend ───────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm install

      # ── Rust / Tauri ──────────────────────────────────────────────────────
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Release ───────────────────────────────────────────────────────────
      - name: Collect installer artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version) { $version = "dev" }

          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null

          # NSIS installer (primary)
          Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "release-artifacts\WinWhisper-${version}-setup.exe" }

          # MSI (alternative)
          Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "release-artifacts\WinWhisper-${version}.msi" }

          Write-Host "Artifacts:"
          Get-ChildItem "release-artifacts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WinWhisper ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-artifacts/*
          body: |
            ## WinWhisper ${{ github.ref_name }}

            ### Installation
            1. Download `WinWhisper-${{ github.ref_name }}-setup.exe`
            2. Run the installer (Windows will show a SmartScreen warning on first run — click **More info → Run anyway**)
            3. WinWhisper opens and starts the transcription engine automatically

            ### First Steps
            - Go to **Models** and download a Whisper model (start with `base` for speed)
            - Drag an audio/video file onto the Dashboard to transcribe
            - Paste a YouTube URL to transcribe videos online

            ### Requirements
            - Windows 10/11 x64
            - 4 GB RAM minimum (8 GB+ recommended for large models)
            - NVIDIA GPU with CUDA 12.1+ for GPU acceleration (CPU works too)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
