name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python sidecar ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('engine/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd engine
          # Fail fast on any pip error — silent failures here previously shipped
          # an engine bundle with zero ML/web deps included.
          # `pip install --upgrade pip` fails on Windows — pip cannot replace its
          # own running pip.exe, and modern pip refuses rather than trying.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          # CPU-only torch keeps the bundle under NSIS's 2 GB mmap limit.
          # GPU transcription still works via CTranslate2's own CUDA support.
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw "torch install failed" }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements.txt install failed" }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "pyinstaller install failed" }

      # Gate the release on the engine's own test suite — a broken API contract
      # or a regressed GPU fallback should never reach an installer.
      - name: Run engine tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install pytest pytest-asyncio httpx
          if ($LASTEXITCODE -ne 0) { throw "test dependency install failed" }
          cd engine
          pytest -q
          if ($LASTEXITCODE -ne 0) { throw "engine tests failed" }

      - name: Build Python sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd engine
          pyinstaller winwhisper_engine.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed" }

      - name: Bundle Visual C++ + UCRT runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # python311.dll depends on:
          #   1) the VC++ 2015-2022 runtime (vcruntime140, msvcp140, etc.)
          #   2) the Universal C Runtime (ucrtbase + ~40 api-ms-win-crt-*.dll)
          # The GitHub Actions runner has both in System32, so PyInstaller
          # doesn't copy them. End-user machines may be missing either set
          # (especially UCRT on stripped or N/KN Windows editions), causing
          # LoadLibrary("python311.dll") to fail with the misleading
          # "module could not be found" error. Copy both sets into _internal
          # so the bundle is fully self-contained.
          $target = "engine\dist\winwhisper_engine\_internal"
          if (-not (Test-Path $target)) {
            throw "Expected PyInstaller _internal dir at $target but it is missing"
          }

          # ── VC++ runtime (from System32) ─────────────────────────────────
          $vcCandidates = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "msvcp140_codecvt_ids.dll",
            "concrt140.dll",
            "vcomp140.dll",
            "vccorlib140.dll"
          )
          $vcCopied = @()
          foreach ($dll in $vcCandidates) {
            $src = Join-Path "C:\Windows\System32" $dll
            $dst = Join-Path $target $dll
            if (Test-Path $dst) { continue }
            if (Test-Path $src) {
              Copy-Item $src $dst -Force
              $vcCopied += $dll
            }
          }
          if ($vcCopied.Count -gt 0) {
            Write-Host "Bundled VC++ runtime DLLs: $($vcCopied -join ', ')"
          } else {
            Write-Host "VC++ runtime DLLs already present in bundle."
          }
          if (-not (Test-Path (Join-Path $target "vcruntime140.dll"))) {
            throw "vcruntime140.dll could not be located or bundled — engine will not start on user machines."
          }

          # ── Universal C Runtime (App-Local CRT, from Windows Kits) ───────
          # Microsoft ships UCRT App-Local DLLs specifically for this scenario:
          # https://learn.microsoft.com/en-us/cpp/windows/universal-crt-deployment
          $ucrtRoot = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Redist" -Recurse -Filter "ucrtbase.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $ucrtRoot) {
            Write-Host "WARNING: Could not locate UCRT redist directory under Windows Kits. Falling back to System32."
            $ucrtRoot = "C:\Windows\System32"
          }
          Write-Host "UCRT redist source: $ucrtRoot"

          $ucrtCopied = @()
          # ucrtbase.dll itself
          $ucrtbaseSrc = Join-Path $ucrtRoot "ucrtbase.dll"
          $ucrtbaseDst = Join-Path $target "ucrtbase.dll"
          if (-not (Test-Path $ucrtbaseDst) -and (Test-Path $ucrtbaseSrc)) {
            Copy-Item $ucrtbaseSrc $ucrtbaseDst -Force
            $ucrtCopied += "ucrtbase.dll"
          }
          # Copy *every* DLL from the UCRT redist (not just api-ms-win-crt-*).
          # On some Windows variants python311.dll transitively pulls
          # api-ms-win-core-* / api-ms-win-eventing-* / etc. that PyInstaller
          # does not bundle. Casting a wider net costs ~1 MB and is harmless.
          $allUcrtDlls = Get-ChildItem $ucrtRoot -Filter "*.dll" -ErrorAction SilentlyContinue
          if (-not $allUcrtDlls -and (Test-Path "C:\Windows\System32\downlevel")) {
            $allUcrtDlls = Get-ChildItem "C:\Windows\System32\downlevel" -Filter "*.dll" -ErrorAction SilentlyContinue
          }
          foreach ($f in $allUcrtDlls) {
            $dst = Join-Path $target $f.Name
            if (-not (Test-Path $dst)) {
              Copy-Item $f.FullName $dst -Force
              $ucrtCopied += $f.Name
            }
          }
          Write-Host "Bundled UCRT App-Local DLLs ($($ucrtCopied.Count)):"
          $ucrtCopied | ForEach-Object { Write-Host "  $_" }
          if (-not (Test-Path (Join-Path $target "ucrtbase.dll"))) {
            throw "ucrtbase.dll could not be located — Python will not load on systems without UCRT."
          }

      - name: Create _internal.zip for Tauri bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Tauri's NSIS resource bundler reliably handles individual files but
          # silently drops subdirectory structure when using **/* globs.
          # PyInstaller's _internal/ contains package subdirs with .pyd extension
          # modules (e.g. _internal/pydantic_core/_pydantic_core.cp311-win_amd64.pyd)
          # that were never reaching the installed app. Fix: create a single ZIP
          # of the entire _internal/ tree so Tauri can bundle it as one file,
          # then extract it at first run in Rust.
          $internalDir = Resolve-Path "engine\dist\winwhisper_engine\_internal"
          $zipOut = Join-Path (Resolve-Path "engine\dist\winwhisper_engine") "_internal.zip"
          if (Test-Path $zipOut) { Remove-Item $zipOut }
          Write-Host "Creating $zipOut from $internalDir ..."
          Add-Type -Assembly System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $internalDir,
            $zipOut,
            [System.IO.Compression.CompressionLevel]::NoCompression,
            $false   # don't include "_internal" as the root entry inside the ZIP
          )
          $sizeMB = [math]::Round((Get-Item $zipOut).Length / 1MB, 1)
          Write-Host "_internal.zip created: $sizeMB MB"
          # Quick sanity check: the ZIP must contain pydantic_core entry
          $listing = & "C:\Program Files\7-Zip\7z.exe" l $zipOut 2>&1
          $hasPydantic = $listing | Where-Object { $_ -match "pydantic_core" }
          if (-not $hasPydantic) {
            throw "_internal.zip does not contain pydantic_core — bundle is incomplete"
          }
          $hasVad = $listing | Where-Object { $_ -match "silero.*\.onnx" }
          if (-not $hasVad) {
            throw "_internal.zip does not contain the Silero VAD model — transcription would fail at runtime"
          }
          Write-Host "ZIP sanity check passed (pydantic_core + Silero VAD present)."

      - name: Diagnose python311.dll dependencies
        shell: pwsh
        run: |
          # Run dumpbin /dependents so the CI log shows every DLL the bundle
          # actually pulls in. If a future release fails with LoadLibrary
          # errors, this list tells us exactly what to bundle next.
          $target = "engine\dist\winwhisper_engine\_internal"
          $py = Join-Path $target "python311.dll"
          if (-not (Test-Path $py)) {
            Write-Host "python311.dll not in bundle — skipping dependency dump."
            exit 0
          }

          # Find dumpbin.exe from the VS 2022 install on the runner.
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = $null
          if (Test-Path $vswhere) {
            $installPath = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($installPath) {
              $dumpbin = Get-ChildItem (Join-Path $installPath "VC\Tools\MSVC") -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "Hostx64\\x64" } |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }
          if (-not $dumpbin) {
            Write-Host "dumpbin.exe not found — skipping dependency dump (non-fatal)."
            exit 0
          }

          Write-Host "==== dumpbin /dependents python311.dll ===="
          & $dumpbin /dependents $py
          Write-Host ""
          Write-Host "==== Bundle DLLs present in _internal (count + first 60) ===="
          $all = Get-ChildItem $target -Filter "*.dll" | Sort-Object Name
          Write-Host "Total DLLs in _internal: $($all.Count)"
          $all | Select-Object -First 60 | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Verify engine bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "engine\dist\winwhisper_engine"
          if (-not (Test-Path $src)) { throw "PyInstaller output not found: $src" }
          if (-not (Test-Path "$src\winwhisper_engine.exe")) { throw "Engine EXE missing at: $src\winwhisper_engine.exe" }
          if (-not (Test-Path "$src\_internal.zip")) { throw "_internal.zip missing — ZIP creation step must have failed" }
          $exeMB  = [math]::Round((Get-Item "$src\winwhisper_engine.exe").Length / 1MB, 1)
          $zipMB  = [math]::Round((Get-Item "$src\_internal.zip").Length   / 1MB, 1)
          Write-Host "Engine bundle ready: EXE=$exeMB MB, _internal.zip=$zipMB MB"

          # faster-whisper's Silero VAD model is a data file, not a module, so
          # nothing in the import graph pulls it in. v0.3.0 shipped without it
          # and failed every transcription (vad_filter defaults to true).
          $vad = Get-ChildItem "$src\_internal\faster_whisper\assets" -Filter "*.onnx" -ErrorAction SilentlyContinue
          if (-not $vad) {
            throw "No Silero VAD .onnx found under _internal\faster_whisper\assets — " +
                  "the spec must collect_data_files('faster_whisper'). Transcription would fail at runtime."
          }
          Write-Host "VAD model bundled: $($vad.Name) ($([math]::Round($vad.Length/1MB,2)) MB)"

          # certifi's CA bundle is the same shape of problem: a data file that
          # nothing imports. httpx builds an SSL context when a client is
          # constructed, so without it remote transcription fails the moment it
          # reaches for another machine — long after startup, where the smoke
          # test would not see it.
          $ca = Get-ChildItem "$src\_internal\certifi" -Filter "cacert.pem" -Recurse -ErrorAction SilentlyContinue
          if (-not $ca) {
            throw "No certifi cacert.pem under _internal\certifi — the spec must " +
                  "collect_data_files('certifi'). Remote transcription would fail at runtime."
          }
          Write-Host "CA bundle present: $($ca.FullName)"

      - name: Smoke-test bundled engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "engine\dist\winwhisper_engine\winwhisper_engine.exe"
          $cwd = (Resolve-Path "engine\dist\winwhisper_engine").Path
          $logPath = Join-Path $env:RUNNER_TEMP "engine-smoke.log"
          $errPath = Join-Path $env:RUNNER_TEMP "engine-smoke.err.log"
          if (Test-Path $logPath) { Remove-Item $logPath }
          if (Test-Path $errPath) { Remove-Item $errPath }
          Write-Host "Spawning $exe — waiting up to 90s for WINWHISPER_PORT= ..."

          # Redirect stdout/stderr to files so we never block on pipe reads.
          # Mirror the runtime env Rust sets so buffering matches production.
          $env:PYTHONUNBUFFERED = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $cwd `
            -RedirectStandardOutput $logPath -RedirectStandardError $errPath `
            -NoNewWindow -PassThru

          $port = $null
          $deadline = [DateTime]::UtcNow.AddSeconds(90)
          while ([DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 500
            if (Test-Path $logPath) {
              $hit = Select-String -Path $logPath -Pattern '^WINWHISPER_PORT=(\d+)' -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) {
                $port = $hit.Matches[0].Groups[1].Value
                break
              }
            }
            if ($proc.HasExited) { break }
          }

          if ($port -eq $null) {
            Write-Host "---- engine stdout ----"
            if (Test-Path $logPath) { Get-Content $logPath | ForEach-Object { Write-Host "[engine] $_" } }
            Write-Host "---- engine stderr ----"
            if (Test-Path $errPath) { Get-Content $errPath | ForEach-Object { Write-Host "[engine!] $_" } }
            if (-not $proc.HasExited) { try { $proc.Kill() } catch {} }
            throw "Bundled engine did not print WINWHISPER_PORT= within 90s — bundle is broken (see logs above)"
          }
          Write-Host "Bundled engine announced port $port — now pushing real audio through it."

          # Booting is not proof of anything. v0.3.0 booted fine and then failed
          # every transcription because a data file was missing from the bundle.
          # Download a model and transcribe with vad_filter=true — the exact path
          # that was broken — against the frozen exe we are about to ship.
          $smokeFailed = $false
          try {
            python engine\tools\smoke_transcribe.py --port $port --model tiny --timeout 900
            if ($LASTEXITCODE -ne 0) { $smokeFailed = $true }
          } catch {
            $smokeFailed = $true
          }

          Write-Host "---- engine stdout ----"
          if (Test-Path $logPath) { Get-Content $logPath | ForEach-Object { Write-Host "[engine] $_" } }
          Write-Host "---- engine stderr ----"
          if (Test-Path $errPath) { Get-Content $errPath | ForEach-Object { Write-Host "[engine!] $_" } }

          if (-not $proc.HasExited) { try { $proc.Kill() } catch {} }

          if ($smokeFailed) {
            throw "Bundled engine could not complete a transcription — do not ship this build (see logs above)"
          }
          Write-Host "Bundled engine transcribes end to end."

      # ── Node / Frontend ───────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm install

      - name: Run frontend tests
        run: npm test

      # ── Rust / Tauri ──────────────────────────────────────────────────────
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The bundler fetches its NSIS toolchain from GitHub on every fresh
      # runner. That download fails often enough to block releases outright
      # ("failed to bundle project `io: Peer disconnected`"), so keep it
      # between runs.
      - name: Cache the Tauri bundler toolchain
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: ${{ runner.os }}-tauri-tools-nsis-3.11

      - name: Build Tauri app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Compilation is deterministic; the toolchain download is not. Retry
          # the whole build rather than fail a release on a dropped connection.
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "=== tauri build, attempt $i of $attempts ==="
            npm run tauri:build
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Build succeeded on attempt $i."
              exit 0
            }
            if ($i -lt $attempts) {
              Write-Host "Attempt $i failed; retrying in 30s..."
              Start-Sleep -Seconds 30
            }
          }
          throw "tauri build failed after $attempts attempts"

      # ── Verify the shipped executable carries the current app icon ───────
      # A stale icon survived a release once: tauri-build does not list the
      # icons as a build input, so with a warm Rust cache the old icon stayed
      # embedded. Read the icon back out of the built exe and check it is the
      # green mark rather than whatever was there before.
      - name: Verify embedded app icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing

          $exe = Get-ChildItem "src-tauri\target\release\WinWhisper.exe" -ErrorAction SilentlyContinue
          if (-not $exe) {
            $exe = Get-ChildItem "src-tauri\target\release\*.exe" |
              Where-Object { $_.Name -notmatch "setup|installer" } | Select-Object -First 1
          }
          if (-not $exe) { throw "Could not find the built executable to check its icon" }
          Write-Host "Reading the icon embedded in $($exe.Name)"

          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)
          $bmp = $icon.ToBitmap()

          # Count how much of the icon is the accent green (#427657) vs the old
          # indigo (#6366F1). Sampling the tile is enough to tell them apart.
          $green = 0; $indigo = 0; $total = 0
          for ($y = 0; $y -lt $bmp.Height; $y++) {
            for ($x = 0; $x -lt $bmp.Width; $x++) {
              $p = $bmp.GetPixel($x, $y)
              if ($p.A -lt 128) { continue }
              $total++
              if ([Math]::Abs($p.R - 66) -lt 40 -and [Math]::Abs($p.G - 118) -lt 40 -and [Math]::Abs($p.B - 87) -lt 40) { $green++ }
              if ([Math]::Abs($p.R - 99) -lt 40 -and [Math]::Abs($p.G - 102) -lt 40 -and [Math]::Abs($p.B - 241) -lt 40) { $indigo++ }
            }
          }
          Write-Host "Opaque pixels: $total, accent-green: $green, legacy-indigo: $indigo"

          if ($indigo -gt 0) {
            throw "The executable still carries the OLD indigo icon ($indigo pixels). The icon resource is stale."
          }
          if ($total -eq 0 -or ($green / $total) -lt 0.25) {
            throw "The executable's icon is not the WinWhisper mark — only $green of $total opaque pixels are accent green."
          }
          Write-Host "OK: the shipped executable carries the current mark."

      # ── Verify NSIS installer contains _internal/ ─────────────────────────
      # 7-Zip can read an NSIS installer's embedded archive. We use it to
      # confirm that winwhisper_engine\_internal\python311.dll made it into
      # the installer before publishing the release. Previous versions shipped
      # with _internal/ silently absent because the resource glob flattened
      # all subdirectory files into winwhisper_engine/ directly.
      - name: Verify NSIS installer size
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found in bundle output" }

          # NOTE: 7-zip parses NSIS installers by showing the SetOutPath destination
          # ("winwhisper_engine") as the entry name — individual filenames are not
          # exposed. Size is the reliable proxy: _internal.zip is ~813 MB; without it
          # the entire installer would compress to under 80 MB.
          $installerMB = [math]::Round($installer.Length / 1MB, 0)
          Write-Host "Installer: $($installer.Name) — $installerMB MB"
          if ($installerMB -lt 150) {
            throw "Installer is only $installerMB MB — expected > 150 MB. " +
                  "_internal.zip (~813 MB) is likely missing from the bundle."
          }
          Write-Host "OK: installer is $installerMB MB — _internal.zip is present."

      # ── Release ───────────────────────────────────────────────────────────
      - name: Collect installer artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version) { $version = "dev" }

          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null

          # NSIS installer
          Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "release-artifacts\WinWhisper-${version}-setup.exe" }

          Write-Host "Artifacts:"
          Get-ChildItem "release-artifacts"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WinWhisper ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release-artifacts/*
          body: |
            ## WinWhisper ${{ github.ref_name }}

            ### Installation
            1. Download `WinWhisper-${{ github.ref_name }}-setup.exe`
            2. Run the installer (Windows will show a SmartScreen warning on first run — click **More info → Run anyway**)
            3. WinWhisper opens and starts the transcription engine automatically

            ### First Steps
            - Go to **Models** and download a Whisper model (start with `base` for speed)
            - Drag an audio/video file onto the Dashboard to transcribe
            - Paste a YouTube URL to transcribe videos online

            ### Requirements
            - Windows 10/11 x64
            - 4 GB RAM minimum (8 GB+ recommended for large models)
            - NVIDIA GPU with CUDA 12.1+ for GPU acceleration (CPU works too)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
